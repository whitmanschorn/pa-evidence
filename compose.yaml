# The whole stack: HAPI FHIR (with its Postgres) and the API (which also serves the UI at /ui).
# Images are pinned by multi-arch index digest; the tag is kept for readability.
# Ollama normally runs natively on the host (Metal), reached at host.docker.internal:11434. For a machine without
# native Ollama there is an opt-in profile: `docker compose --profile ollama-in-docker up -d`, then set
# OLLAMA_BASE_URL=http://ollama:11434 in .env (CPU-only inside Docker on a Mac: much slower).
name: pa-evidence

services:
  hapi-db:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      # No password: this database publishes no port and is reachable only from the compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - hapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 3s
      retries: 20

  hapi:
    image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    depends_on:
      hapi-db:
        condition: service_healthy
    ports:
      # Host-only: the FHIR server is reachable from this machine, never from the network.
      - "127.0.0.1:8090:8080"
    environment:
      spring.datasource.url: jdbc:postgresql://hapi-db:5432/hapi
      spring.datasource.username: hapi
      spring.datasource.password: ""
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      # Never answer a search from a cached result set: a reload must be visible to the next search.
      hapi.fhir.reuse_cached_search_results_millis: 0
    healthcheck:
      # The image is distroless (no shell, no curl); it ships this Java probe of /actuator/health.
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pa-evidence-api:local
    depends_on:
      hapi:
        condition: service_healthy
    env_file: .env # AUTH_TOKENS and PROBE_TOKEN from `make tokens`, plus OLLAMA_* and LOG_LEVEL
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
      AUDIT_DB_PATH: /app/var/audit.db
      POLICIES_DIR: /app/data/policies
      # Ollama runs natively on the host (Metal); it listens on the host's 127.0.0.1 only.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - audit:/app/var
      # Policy versions are dropped in on the host and picked up by POST /admin/policies/reload (make reload-policies).
      - ./data/policies:/app/data/policies:ro
      # Model versions likewise, picked up by POST /admin/models/reload (make reload-models).
      - ./data/models:/app/data/models:ro
    healthcheck:
      # The probe role exists for this: it can read /health and nothing else.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health',{headers:{authorization:'Bearer '+process.env.PROBE_TOKEN}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    profiles: ["ollama-in-docker"]
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    volumes:
      - ollama-models:/root/.ollama
    # No published port: only the API, on the compose network, talks to it.

volumes:
  hapi-db:
  audit:
  ollama-models:
